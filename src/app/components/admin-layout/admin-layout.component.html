<div class="admin-shell">
  <aside class="sidebar">
    <div class="brand-lockup">
      <span class="brand-mark"><img src="assets/images/icons/shop_icon.png" alt="Fashion Store Logo"></span>
      <span class="brand-text">
        <strong>Fashion Store</strong>
        <span>Admin</span>
      </span>
    </div>

    <nav class="menu" aria-label="Navigation admin">
      <a routerLink="/admin/dashboard" routerLinkActive="active">
        <i class="bi bi-grid-1x2"></i>
        Dashboard
      </a>

      <a routerLink="/admin/categories" routerLinkActive="active">
        <i class="bi bi-tags"></i>
        Catégories
      </a>

      <a routerLink="/admin/products" routerLinkActive="active">
        <i class="bi bi-box-seam"></i>
        Produits
      </a>

      <a routerLink="/admin/orders" routerLinkActive="active">
        <i class="bi bi-bag-check"></i>
        Commandes
      </a>

      <a routerLink="/admin/clients" routerLinkActive="active">
        <i class="bi bi-people"></i>
        Clients
      </a>
    </nav>

    <!-- <div class="sidebar-note">
      <i class="bi bi-stars"></i>
      <p>Identité pastel unifiée pour toute la boutique.</p>
    </div> -->

    <button type="button" class="logout" (click)="logout()">
      <i class="bi bi-box-arrow-left"></i>
      Déconnexion
    </button>
  </aside>

  <section class="admin-content">
    <header class="topbar">
      <div>
        <p>Espace administrateur</p>
        <h1>Gestion Fashion Store</h1>
      </div>
      <span class="admin-pill"><i class="bi bi-shield-check"></i> Admin</span>
    </header>

    <div class="content-card">
      <router-outlet></router-outlet>
    </div>
  </section>
</div>
