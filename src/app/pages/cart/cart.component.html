<section class="page">
  <div class="page-headline">
    <p class="eyebrow">Panier</p>
    <h1>Mon panier</h1>
  </div>

  <div class="empty" *ngIf="items.length === 0">
    <i class="bi bi-bag"></i>
    Votre panier est vide.
  </div>

  <div class="cart-list" *ngIf="items.length > 0">
    <article *ngFor="let item of items">
      <img *ngIf="item.image" [src]="item.image" [alt]="item.productName">

      <div class="info">
        <h3>{{ item.productName }}</h3>
        <p>{{ item.price }} TND</p>
      </div>

      <input
        type="number"
        min="1"
        [value]="item.quantity"
        (input)="updateQuantity(item.productId, $event)"
        aria-label="Quantité"
      >

      <strong>{{ item.price * item.quantity }} TND</strong>

      <button type="button" (click)="remove(item.productId)">
        <i class="bi bi-trash3"></i>
        Supprimer
      </button>
    </article>

    <div class="summary">
      <div>
        <span>Total</span>
        <h2>{{ total() }} TND</h2>
      </div>
      <a routerLink="/orders">
        Passer la commande
        <i class="bi bi-arrow-right"></i>
      </a>
    </div>
  </div>
</section>
